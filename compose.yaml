services:
  unrealircd:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: obsidian-unrealircd
    restart: unless-stopped
    ports:
      - "${SSL_HOST_PORT:-6697}:6697"
    volumes:
      - ${CONF_BIND:-unrealircd_conf}:/home/unrealircd/unrealircd/conf
      - ${DATA_BIND:-unrealircd_data}:/home/unrealircd/unrealircd/data
      - ${LOGS_BIND:-unrealircd_logs}:/home/unrealircd/unrealircd/logs
      - ${TLS_BIND:-unrealircd_tls}:/home/unrealircd/unrealircd/tls
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6697"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  unrealircd_conf:
    driver: local
  unrealircd_data:
    driver: local
  unrealircd_logs:
    driver: local
  unrealircd_tls:
    driver: local
