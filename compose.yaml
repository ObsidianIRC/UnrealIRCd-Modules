services:
  unrealircd:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: obsidian-unrealircd
    restart: unless-stopped
    ports:
      - "${IRC_PORT:-6667}:${IRC_PORT:-6667}"
      - "${SSL_PORT:-6697}:${SSL_PORT:-6697}"
    volumes:
      - unrealircd_conf:/home/unrealircd/unrealircd/conf
      - unrealircd_data:/home/unrealircd/unrealircd/data
      - unrealircd_logs:/home/unrealircd/unrealircd/logs
      - unrealircd_tls:/home/unrealircd/unrealircd/tls
    env_file:
      - path: .env
        required: false
    networks:
      - irc_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${IRC_PORT:-6667}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  unrealircd_conf:
    driver: local
  unrealircd_data:
    driver: local
  unrealircd_logs:
    driver: local
  unrealircd_tls:
    driver: local

networks:
  irc_network:
    driver: bridge
